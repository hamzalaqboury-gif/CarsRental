providers = ["php"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist"
]

[phases.build]
cmds = []

[start]
cmd = "php artisan config:cache; php artisan route:cache; php artisan view:cache; php artisan storage:link --force; php artisan migrate --force --no-interaction & php artisan serve --host=0.0.0.0 --port=$PORT"